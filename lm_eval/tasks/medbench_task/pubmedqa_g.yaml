task: pubmedqa_g
dataset_path: qiaojin/PubMedQA
dataset_name: pqa_labeled
output_type: generate_until
training_split: train
validation_split: train
test_split: train
#doc_to_text: !function preprocess_pubmedqa.doc_to_text

#doc_to_text: "Q: {{QUESTION.strip()}} (Yes) (No) (Maybe)\nA: Provide the final answer enclosed in boxed{the_answer}."
doc_to_text: "Instructions: The following are multiple choice questions about medical knowledge. Solve them in a step-by-step fashion, starting by summarizing the available information. Output a single option from the three options as the final answer.\n\n Question: {{context.contexts | join(' ')}} {{question.strip()}} (A) Yes (B) No (C) Maybe \n Response (think step by step and then end with 'Final Answer:' followed by *only* the letter corresponding to the correct answer enclosed in parentheses)"
doc_to_target: '{{ {"yes":"A","no":"B","maybe":"C"}[final_decision] }}'
# doc_to_choice: ["yes", "no", "maybe"]

generation_kwargs:
  until:
    - "</s>"
    - "Q:"
    - "<|im_end|>"
    - "<|end_of_text|>"
  do_sample: false
  temperature: 0.0
  top_p: 1.0
  
filter_list:
  - name: strict-final-answer
    filter:
      - function: regex
        # last "Final Answer:(X)", "The answer is X" or \boxed{X}, capital letter only.
        # The old (?i)Answer[^A-D]* pattern took the first "answer" in the text, so
        # "To answer this question, we need" scored as "d".
        regex_pattern: '(?:[Aa]nswer(?:\s+is)?|ANSWER(?:\s+IS)?|boxed\{)[\s:*(\[{$\\]*([A-D])(?![A-Za-z0-9])'
        group_select: -1
      - function: "take_first"

metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
    ignore_case: true
    ignore_punctuation: true
