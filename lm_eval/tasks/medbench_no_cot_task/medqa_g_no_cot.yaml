task: medqa_g_no_cot
dataset_path: GBaker/MedQA-USMLE-4-options-hf

output_type: generate_until
training_split: train
validation_split: validation
test_split: test
doc_to_text: "Question: {{sent1}} (A) {{ending0}} (B) {{ending1}} (C) {{ending2}} (D) {{ending3}}\n Response (end with 'Final Answer:' followed by *only* the letter corresponding to the correct answer enclosed in parentheses)"
doc_to_target: "{{['A', 'B', 'C', 'D'][label]}}"
generation_kwargs:
  until:
    - "</s>"
    - "Q:"
    - "<|im_end|>"
    - "<|end_of_text|>"
  do_sample: false
  temperature: 0.0
  top_p: 1.0
  
filter_list:
  - name: strict-final-answer
    filter:
      - function: regex
        # last "Final Answer:(X)", "The answer is X" or \boxed{X}, capital letter only.
        # The old (?i)Answer[^A-D]* pattern took the first "answer" in the text, so
        # "To answer this question, we need" scored as "d".
        regex_pattern: '(?:[Aa]nswer(?:\s+is)?|ANSWER(?:\s+IS)?|boxed\{)[\s:*(\[{$\\]*([A-D])(?![A-Za-z0-9])'
        group_select: -1
      - function: "take_first"

metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
    ignore_case: true
    ignore_punctuation: true
